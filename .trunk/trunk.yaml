        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js

actions:
  enabled:
    - trunk-cache-prune
    - trunk-upgrade-available

  disabled:
    # git-hook-triggered actions disabled so trunk releases core.hooksPath to
    # the shared ~/.config/git/hooks dispatcher (Entire checkpoints, AI
    # co-author stripping, branch policy), matching gtm-sdk. With them enabled,
    # any `trunk check` run re-points core.hooksPath at Trunk's own cache.
    # trunk-check-pre-push is also redundant with roborev review and the merge
    # queue's required lint check (.rwx/lint.yml); git-lfs is unused
    # in this repo.
    - trunk-fmt-pre-commit
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push

merge:
  # These must be live GitHub status names posted on every PR targeting main.
  # Re-verify after any pipeline rename:
  #   gh pr checks <pr-number> --json name --jq '.[].name'
  #
  # The queue reads this list from the tested ref -- the PR head for an
  # up-to-date entry (every queue landing so far has merged directly, with
  # no trunk-merge/* test branch ever created), or the trunk-merge/* test
  # branch otherwise -- so a rename that lands without moving its entry
  # here stalls the queue on a name that no longer posts (proven by the
  # 2026-10-16 ci.yml -> tests.yml rename, which moved its entry in
  # lockstep).
  #
  # The two RWX entries (.rwx/tests.yml and .rwx/lint.yml) are the
  # test gate (pytest plus the gen_operations/codegen drift checks and the
  # lean-install wheel check) and the lint gate (trunk + tach external audit), matching gtm-sdk's
  # two-gate queue. Neither pipeline's pull_request trigger has a
  # base-branch filter (unlike gtm-sdk's, which gate on
  # base-branch == 'main'), so both post on every PR -- and if the queue
  # ever does build a trunk-merge/* test branch with a PR, it arrives as an
  # ordinary pull_request event and fires them the same way (the mechanism
  # gtm-sdk's queue relies on). RWX posts them as commit statuses
  # (contexts) here rather than check-runs; the queue and `gh pr checks`
  # match on the name either way.
  #
  # "pullfrog-approval" is the pullfrog GitHub App's pass/fail verdict on
  # the PR under review (success = approved, failure = changes requested),
  # posted as a check-run on every PR pullfrog reviews -- distinct from the
  # plain "pullfrog" check, which only mirrors the agent run itself. It has
  # posted on every PR reviewed since the 0.1.95 bump (#108-#112, including
  # the bot-authored #100/#101). Required since 2026-10-16 to match the repo
  # ruleset, which gates PR admission and merges into main on the GitHub side.
  #
  # The lint gate is two-layered: its PR mode diffs against the PR's
  # exact base commit (--upstream=$MERGE_BASE, see .rwx/lint.yml), so the
  # required PR status stays diff-scoped and pre-existing tree state can
  # never block an unrelated PR or the queue, while push/cli runs of the
  # same pipeline lint the whole tree (trunk-check-full) and turn main
  # red on drift that slipped past incremental PR runs.
  #
  # Deliberately excluded -- each of these would deadlock the queue:
  # - "Entire Gates": advisory only (not a required check on main), and not
  #   waited on here: it does not post on PRs opened before the Entire app was
  #   installed (~2026-10-10) and has been observed stuck IN_PROGRESS on an
  #   already-merged PR. Revisit once it posts reliably on every PR.
  # - "pullfrog" / "Corridor Review": review-run mirrors without pass/fail
  #   semantics (pullfrog's verdict itself is "pullfrog-approval" above).
  # - Netlify deploy previews and header/redirect/pages checks: only post on
  #   docs-changing PRs (path-dependent), like gtm-sdk's path-filtered
  #   "Docs checks" workflow.
  # - "RWX: integration-tests.yml (pull request)": gated by its trigger's
  #   `if:` to PRs authored by the repo owner, so it never posts a usable
  #   verdict on bot/collaborator PRs -- on entire[bot]/pullfrog PRs it
  #   never posts a status at all. (Pre-#191 it errored out immediately
  #   with "This run failed to start" -- the expression path was broken
  #   for every PR, not just non-owner ones; #191 fixed it.) Owner PR
  #   runs resolve the `sdk-python-linear-it` key unattended (approvals
  #   disabled, `**` grant; see .rwx/integration-tests.yml), so requiring
  #   it would stall every non-owner queue entry. History: #186 briefly
  #   gated the vault behind approvals, leaving this status pending until
  #   a human approved -- #189 removed that.
  #
  # Do NOT add path-filtered or workflow_run workflows here -- they do not
  # report on every PR and would deadlock the queue -- nor author-gated
  # statuses like the integration-tests PR leg above, which posts no usable
  # verdict on other authors' PRs. Approvals-gated statuses are out for the
  # same reason: posting on every PR is not enough when the verdict only
  # resolves behind a human vault approval.
  #
  # Residual risk for "pullfrog-approval": every landing so far merged
  # directly against the PR head, where pullfrog always posts. The check
  # can still go missing and stall the queue (Queued forever instead of
  # failing loudly) in two ways: (a) pullfrog skips a PR, is down or
  # rate-limited, or does not re-run after a rebase or force-push, so the
  # verdict never posts on the current head; (b) an entry is submitted
  # while out of date with main, so the queue builds a trunk-merge/*
  # test branch and waits for this list there -- unverified that pullfrog
  # reviews those. Watch the first entry that stalls. Recovery: re-trigger
  # the pullfrog review on the head; for (b) verify with a throwaway PR
  # deliberately behind main, or drop the entry and rely on the ruleset's
  # GitHub-side gate (PR admission + final merge) instead.
  required_statuses:
    - "RWX: tests.yml (pull request)"
    - "RWX: lint.yml (pull request)"
    - pullfrog-approval
