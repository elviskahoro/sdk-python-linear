on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
    push:
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: probe
    cache: false
    env:
      PROBE_VALUE:
        value: ${{ vaults.sdk-python-linear-probe.secrets.PROBE_VALUE }}
        cache-key: excluded
    run: echo "vault resolved, length ${#PROBE_VALUE}"
