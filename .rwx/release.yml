# One-command release: `rwx run .rwx/release.yml --init version=X.Y.Z`.
# Bumps the version (unless already at target), cuts CHANGELOG.md, opens the
# release PR, waits for checks, squash-merges, then pushes the vX.Y.Z tag,
# which triggers .rwx/publish.yml. Never uses --admin or --auto.
#
# CLI-only on purpose: no PR/push trigger may ever resolve the write token.
# Provision (locked `sdk-python-linear-release` vault; fine-grained PAT on this
# repo only, Contents + Pull requests: Read/Write):
#   rwx vaults secrets set --vault sdk-python-linear-release GITHUB_RELEASE_TOKEN=<pat>
on:
  cli:
    init:
      version: ${{ event.dispatch.version }}
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      repository: https://github.com/elviskahoro/sdk-python-linear.git

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: ${{ init.repository }}
      ref: ${{ init.commit-sha }}

  - key: uv-install
    run: |
      set -euo pipefail
      script="$(mktemp)"
      trap 'rm -f "${script}"' EXIT
      curl -LsSf https://astral.sh/uv/0.11.29/install.sh -o "${script}"
      echo "504a79fd2ed0dcd47e7f04f0792cfd0871f62e24a7fe40fa8ae0f563a369f2bd  ${script}" | sha256sum -c -
      sh "${script}"
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  - key: gh-install
    use: [code]
    call: github/install-cli 1.1.0
    cache: false

  # cache: false: the result depends on remote tags, PRs and checks.
  - key: release
    use: [code, uv-install, gh-install]
    cache: false
    timeout: 60m
    env:
      VERSION: ${{ init.version }}
      BASE_BRANCH: ${{ init.branch }}
      REPO: elviskahoro/sdk-python-linear
      GH_TOKEN:
        value: ${{ vaults.sdk-python-linear-release.secrets.GITHUB_RELEASE_TOKEN }}
        cache-key: excluded
    run: |
      set -euo pipefail
      tag="v${VERSION}"
      [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version" >&2; exit 1; }
      [ "${BASE_BRANCH}" = "main" ] || { echo "refusing: base branch is '${BASE_BRANCH}', not main" >&2; exit 1; }
      if [ -n "$(git ls-remote --tags "https://github.com/${REPO}.git" "refs/tags/${tag}")" ]; then
        echo "refusing: tag ${tag} already exists" >&2; exit 1
      fi
      state="$(python3 scripts/release_prep.py compare "${VERSION}")"
      [ "${state}" != "older" ] || { echo "refusing: pyproject is newer than ${VERSION}" >&2; exit 1; }

      # git/clone strips .git: bootstrap one against main.
      remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
      git init -q
      git remote add origin "${remote}"
      git fetch -q --depth=1 origin main
      git config user.name "release-bot"
      git config user.email "release-bot@users.noreply.github.com"
      git checkout -q -B "release/${tag}" FETCH_HEAD

      files=(CHANGELOG.md)
      if [ "${state}" = "bump" ]; then
        uv version "${VERSION}"
        python3 scripts/release_prep.py readme "${VERSION}"
        files+=(pyproject.toml uv.lock README.md)
      fi
      python3 scripts/release_prep.py changelog "${VERSION}"

      git add -- "${files[@]}"
      git commit -q -m "Release ${tag}"
      git push -q origin "release/${tag}"
      pr_url="$(gh pr create -R "${REPO}" --base main --head "release/${tag}" \
        --title "Release ${tag}" \
        --body "Release ${tag}. After merge: tag \`${tag}\` on main to trigger \`.rwx/publish.yml\`. (Opened by .rwx/release.yml; refs #250.)")"
      pr="${pr_url##*/}"
      echo "release PR: ${pr_url}"

      # Wait for checks and mergeability; never bypass protection.
      for _ in $(seq 1 100); do
        if gh pr checks "${pr}" -R "${REPO}" --required >/dev/null 2>&1; then
          ms="$(gh pr view "${pr}" -R "${REPO}" --json mergeStateStatus -q .mergeStateStatus)"
          [ "${ms}" = "CLEAN" ] && break
          [ "${ms}" = "DIRTY" ] && { echo "merge conflict: ${pr_url}" >&2; exit 1; }
        elif gh pr checks "${pr}" -R "${REPO}" --required 2>&1 | grep -qE '\sfail\s'; then
          echo "required check failed: ${pr_url}" >&2; exit 1
        fi
        sleep 30
      done
      [ "$(gh pr view "${pr}" -R "${REPO}" --json mergeStateStatus -q .mergeStateStatus)" = "CLEAN" ] \
        || { echo "not mergeable in time: ${pr_url}" >&2; exit 1; }

      gh pr merge "${pr}" -R "${REPO}" --squash
      for _ in $(seq 1 40); do
        [ "$(gh pr view "${pr}" -R "${REPO}" --json state -q .state)" = "MERGED" ] && break
        sleep 15
      done
      [ "$(gh pr view "${pr}" -R "${REPO}" --json state -q .state)" = "MERGED" ] \
        || { echo "merge not completed: ${pr_url}" >&2; exit 1; }

      sha="$(gh pr view "${pr}" -R "${REPO}" --json mergeCommit -q .mergeCommit.oid)"
      git fetch -q --depth=1 origin "${sha}"
      git tag "${tag}" "${sha}"
      git push -q origin "${tag}"
      echo "pushed ${tag} at ${sha}; .rwx/publish.yml now publishes to PyPI"
