on:
  github:
    pull_request:
      init:
        event-type: pull_request

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  # Throwaway probe -- lives only on this branch, PR closed unmerged. Tests
  # whether a github-triggered run from this repository can access the
  # locked, repo-scoped `sdk-python-linear` vault (a cli dispatch from a
  # feature branch was denied with "The vault is locked"; per RWX's vault
  # docs, locked vaults grant runs whose repository and git ref match the
  # vault's permission pattern -- this run's repo/branch should match
  # 'elviskahoro/sdk-python-linear:*'). Distinguishable outcomes:
  #   - task fails "The vault is locked"  -> pattern does not grant webhook runs
  #   - task runs, prints EMPTY           -> access granted, secret not yet set
  #   - task runs, prints RESOLVED        -> access granted and secret set
  - key: vault-access-probe
    env:
      GH_TOKEN:
        value: ${{ vaults.sdk-python-linear.secrets.GITHUB_TOKEN }}
        cache-key: excluded
    run: |
      set -uo pipefail
      echo "GH_TOKEN length: ${#GH_TOKEN}"
      if [ -n "${GH_TOKEN:-}" ]; then
        echo "RESOLVED -- vault access granted and secret is set"
      else
        echo "EMPTY -- vault access granted but the secret is not provisioned yet"
      fi
