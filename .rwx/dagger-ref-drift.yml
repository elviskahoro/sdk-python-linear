on:
  cron:
    - key: weekly-dagger-ref-drift
      # Source workflow: `schedule: cron: "0 9 * * 1"` -- weekly Monday 09:00
      # UTC (no timezone declared in the source cron, so UTC). Cron schedules
      # run against the default branch; event.git.* resolves in this trigger
      # context (same pattern as gtm-sdk's .rwx/tests-bazel-full.yml, whose
      # live cron runs confirmed it).
      # During the pilot this ran at 10:00, an hour behind the GHA twin, so
      # the two check-then-create pipelines could not both see open=0 and
      # file duplicate stale-ref issues; with the GHA workflow deleted in the
      # flip, the stagger is moot and the source's 09:00 is restored.
      schedule: 0 9 * * 1
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        repository: https://github.com/elviskahoro/sdk-python-linear.git
  cli:
    # Manual `rwx run` dispatch for validation -- ports the source workflow's
    # `workflow_dispatch: {}` trigger. Mirrors the cron trigger's init params.
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      repository: https://github.com/elviskahoro/sdk-python-linear.git
  dispatch:
    # Ad-hoc drift checks from the Cloud UI / API / CLI (`rwx dispatch
    # dagger-ref-drift --ref main`). Doubles as the empirical test for the
    # cron path's locked-vault access: a dispatch with `--ref main` populates
    # event.git from main and unlocks vaults exactly as the weekly cron does
    # (same repository, same branch pattern).
    - key: dagger-ref-drift
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        repository: https://github.com/elviskahoro/sdk-python-linear.git

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: ${{ init.repository }}
      ref: ${{ init.commit-sha }}
      # Shallow clone (git/clone's default) is enough: the check reads the
      # current workflow and script, never history. Public repo, so no
      # github-token is needed.

  # Packaged leaf for gh (verified via `rwx packages list` 2026-10-03) --
  # installs the latest gh from cli.github.com's apt repo. The package sets
  # `filter: []` and no TTL, so by default this task would be cached
  # indefinitely on whatever gh version the first run installed -- RWX's
  # caching docs call out exactly this "install latest" hazard
  # (https://www.rwx.com/docs/caching). `cache: ttl` is only configurable on
  # command tasks (not `call`), so this opts out of caching entirely; at this
  # pipeline's weekly cadence the reinstall cost is negligible.
  - key: gh-install
    use: [code]
    call: github/install-cli 1.1.0
    cache: false

  # Ports the source workflow's `check` job.
  # cache: false is required, not cosmetic: the result depends on the
  # upstream repo's release tags and on which GitHub issues are open, neither
  # of which is part of this repo's file contents -- a cache hit would skip
  # the very drift this pipeline exists to detect.
  # The source relied on GHA's implicit `github.token` scoped by
  # `permissions: issues: write`; RWX has no implicit token (probed live
  # 2026-10-03: the `${{ github.token }}` expression is not available in
  # task env, so the App installation token can't be used here). GH_TOKEN
  # therefore comes from a locked, repo-scoped custom vault
  # (`sdk-python-linear`) as a fine-grained PAT with Issues: Read/Write on
  # exactly this repo. Vault access is granted for repository runs on main
  # (the weekly cron's ref) and for the account user (cli dispatches); a
  # bare `*` branch pattern was tried and does NOT match -- glob `*` does
  # not cross `/`, so multi-segment branch names like conductor/* never
  # matched. The repo-scoped vault also keeps the secret away from fork-PR
  # runs (a fork's runs carry a different repository slug and never match).
  # Provision with:
  #   rwx vaults secrets set --vault sdk-python-linear GITHUB_TOKEN=<pat>
  # cache-key: excluded keeps the PAT out of the task's cache key (moot
  # while cache: false, but kept so re-enabling caching later can't pin the
  # key to a token value).
  # `-R` is explicit (the source relied on gh's git-remote inference):
  # git/clone strips the .git directory by default, so there is no origin
  # remote for gh to infer the repository from.
  - key: check
    use: [gh-install]
    cache: false
    env:
      GH_TOKEN:
        # trunk-ignore(semgrep/yaml.github-actions.security.gha-workflow-env-secret.gha-workflow-env-secret): task-scoped `env:` in an RWX run definition, not a GHA workflow-level env block — this secret is only visible to this task's own steps, not every job/step in a workflow.
        value: ${{ vaults.sdk-python-linear.secrets.GITHUB_TOKEN }}
        cache-key: excluded
    run: bash scripts/dagger_ref_drift.sh
