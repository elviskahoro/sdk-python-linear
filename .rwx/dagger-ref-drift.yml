on:
  cron:
    - key: weekly-dagger-ref-drift
      # Source workflow: `schedule: cron: "0 9 * * 1"` -- weekly Monday 09:00
      # UTC (no timezone declared in the source cron, so UTC). Cron schedules
      # run against the default branch; event.git.* resolves in this trigger
      # context (same pattern as gtm-sdk's .rwx/tests-bazel-full.yml, whose
      # live cron runs confirmed it).
      # Runs at 10:00, one hour later than the source: during the pilot phase
      # both pipelines run side by side, and each does a check-then-create on
      # the same stale-ref issue -- firing at the same minute lets both see
      # open=0 and file duplicates. The later run sees whatever issue the
      # 09:00 GHA run created. After the flip deletes the GHA workflow, the
      # stagger is moot and can be reverted to the source's 09:00.
      schedule: 0 10 * * 1
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        repository: https://github.com/elviskahoro/sdk-python-linear.git
  cli:
    # Manual `rwx run` dispatch for validation -- ports the source workflow's
    # `workflow_dispatch: {}` trigger. Mirrors the cron trigger's init params.
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      repository: https://github.com/elviskahoro/sdk-python-linear.git

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: ${{ init.repository }}
      ref: ${{ init.commit-sha }}
      # Shallow clone (git/clone's default) is enough: the check greps the
      # current contents of .github/workflows/pypi.yml, it never reads
      # history. Public repo, so no github-token is needed.

  # Packaged leaf for gh (verified via `rwx packages list` 2026-10-03) --
  # installs the latest gh from cli.github.com's apt repo. The package sets
  # `filter: []` and no TTL, so by default this task would be cached
  # indefinitely on whatever gh version the first run installed -- RWX's
  # caching docs call out exactly this "install latest" hazard
  # (https://www.rwx.com/docs/caching). `cache: ttl` is only configurable on
  # command tasks (not `call`), so this opts out of caching entirely; at this
  # pipeline's weekly cadence the reinstall cost is negligible.
  - key: gh-install
    use: [code]
    call: github/install-cli 1.1.0
    cache: false

  # Ports the source workflow's `check` job.
  # cache: false is required, not cosmetic: the result depends on the
  # upstream repo's HEAD and on which GitHub issues are open, neither of
  # which is part of this repo's file contents -- a cache hit would skip the
  # very drift this pipeline exists to detect.
  # The source relied on GHA's implicit `github.token` scoped by
  # `permissions: issues: write`; RWX has no implicit token, so GH_TOKEN must
  # come from the default vault (`rwx vaults secrets set GITHUB_TOKEN=...`)
  # as a PAT with issue-write access to this repo -- see
  # .rwx/.migration-inventory.md. cache-key: excluded keeps that PAT out of
  # the task's cache key (moot while cache: false, but kept so re-enabling
  # caching later can't pin the key to a token value).
  # `-R` is explicit (the source relied on gh's git-remote inference):
  # git/clone strips the .git directory by default, so there is no origin
  # remote for gh to infer the repository from.
  - key: check
    use: [gh-install]
    cache: false
    env:
      GH_TOKEN:
        # trunk-ignore(semgrep/yaml.github-actions.security.gha-workflow-env-secret.gha-workflow-env-secret): task-scoped `env:` in an RWX run definition, not a GHA workflow-level env block — this secret is only visible to this task's own steps, not every job/step in a workflow.
        value: ${{ secrets.GITHUB_TOKEN }}
        cache-key: excluded
    run: |
      set -euo pipefail
      # Fail loudly and specifically when the vault secret is missing, rather
      # than at the first gh call with a confusing auth error that reads like
      # a drift-check failure.
      : "${GH_TOKEN:?GITHUB_TOKEN vault secret not provisioned -- rwx vaults secrets set GITHUB_TOKEN=...}"
      repo=elviskahoro/sdk-python-publish-to-pypi
      # No match (pypi.yml stops pinning the module, or the format changes)
      # exits grep 1 and would kill the task bare under `set -e` -- fail with
      # a message naming the cause instead.
      pinned=$(grep -oP "${repo}@\K[0-9a-f]{40}" .github/workflows/pypi.yml || true)
      [ -n "${pinned}" ] || { echo "no pinned ${repo} ref found in .github/workflows/pypi.yml -- did the pin format change?"; exit 1; }
      head=$(git ls-remote "https://github.com/${repo}" HEAD | cut -f1)
      echo "pinned=${pinned} upstream=${head}"
      if [ "${pinned}" = "${head}" ]; then exit 0; fi
      title="Dagger publish module ref is stale"
      open=$(gh issue list -R elviskahoro/sdk-python-linear --state open --search "\"${title}\" in:title" --json number --jq length)
      if [ "${open}" = "0" ]; then
        gh issue create -R elviskahoro/sdk-python-linear --title "${title}" \
          --body "pypi.yml pins ${repo}@${pinned}, but upstream HEAD is ${head}. Review and re-pin. See #45."
      fi
