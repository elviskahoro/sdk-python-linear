  "CommentCreateInput",
  "CommentFields",
  "CreateAttachmentResult",
  "CreateCommentResult",
  "CreateIssueRelationResult",
  "CreateIssueResult",
  "DOCUMENT",
  "DeleteIssueResult",
  "GetIssueResult",
  "GetTeamByKeyResult",
  "GetTeamResult",
  "GetUserResult",
  "GetViewerResult",
  "IssueContextAttachmentFields",
  "IssueContextCommentFields",
  "IssueContextCommentFieldsExternalUser",
  "IssueContextCommentFieldsUser",
  "IssueContextRelationFields",
