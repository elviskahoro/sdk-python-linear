# Enforce the SDK package's internal dependency direction.
source_roots = ["."]
exclude = [
  "tests/**",
  "docs/**",
  "tmp/**",
  "worktrees/**",
  ".venv/**",
  ".agents/**",
  ".beads/**",
  ".context/**",
  ".entire/**",
  ".github/**",
]

forbid_circular_dependencies = true
exact = true
root_module = "forbid"
ignore_type_checking_imports = false
include_string_imports = true
layers_explicit_depends_on = true
layers = [
  "tooling",
  "entrypoints",
  "api",
  "workflow",
  "operations",
  "transport",
  "pagination",
  "configuration",
  "errors",
  "generated",
  "models",
]

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"
unused_external_dependencies = "error"

[cache]
file_dependencies = ["tests/**", "pyproject.toml", "uv.lock", "tach.toml"]

[external]
# Tach resolves an import to a distribution name via importlib.metadata of
# the *active* environment: under `uv run` (dev venv) `strawberry` resolves
# to the `strawberry-graphql` distribution and `graphql` to `graphql-core`.
# An `exclude` entry only suppresses the import when it matches the resolved
# name, and empirically (tach 0.35.1) a hyphenated env-resolved name never
# matches an exclude entry directly -- so `strawberry`/`graphql` below would
# be ignored exactly when the audit runs inside the dev venv
# (.rwx/ci.yml's tach-external task). The identity `rename` entries pin the
# resolved names to the module names, making the excludes match in every
# environment (dev venv, CI, or bare). ruff maps to a distribution of the
# same name and tomllib is stdlib, so neither needs a rename.
rename = ["graphql:graphql", "strawberry:strawberry"]
exclude = ["graphql", "ruff", "strawberry", "tomllib"]

[[modules]]
path = "scripts"
layer = "tooling"
visibility = []
depends_on = ["gtm_linear"]

[[modules]]
path = "gtm_linear"
layer = "api"
visibility = ["gtm_linear.cli", "scripts"]
depends_on = [
  "gtm_linear._generated",
  "gtm_linear.client",
  "gtm_linear.exceptions",
  "gtm_linear.models",
  "gtm_linear.mutations",
  "gtm_linear.queries",
  "gtm_linear.workflow",
]

[[modules]]
path = "gtm_linear._generated"
layer = "generated"
visibility = [
  "gtm_linear",
  "gtm_linear.cli",
  "gtm_linear.mutations",
  "gtm_linear.queries",
  "gtm_linear.workflow",
]
depends_on = ["gtm_linear.models"]

[[modules]]
path = "gtm_linear._schema"
layer = "generated"
visibility = []
depends_on = []

[[modules]]
path = "gtm_linear.cli"
layer = "entrypoints"
visibility = []
depends_on = [
  "gtm_linear",
  "gtm_linear._generated",
  "gtm_linear.exceptions",
  "gtm_linear.pagination",
  "gtm_linear.settings",
  "gtm_linear.workflow",
]

[[modules]]
path = "gtm_linear.client"
layer = "transport"
visibility = [
  "gtm_linear",
  "gtm_linear.mutations",
  "gtm_linear.queries",
  "gtm_linear.workflow",
]
depends_on = ["gtm_linear.exceptions", "gtm_linear.settings"]

[[modules]]
path = "gtm_linear.exceptions"
layer = "errors"
visibility = [
  "gtm_linear",
  "gtm_linear.cli",
  "gtm_linear.client",
  "gtm_linear.pagination",
  "gtm_linear.queries",
]
depends_on = []

[[modules]]
path = "gtm_linear.models"
layer = "models"
visibility = ["gtm_linear", "gtm_linear._generated"]
depends_on = []

[[modules]]
path = "gtm_linear.mutations"
layer = "operations"
visibility = ["gtm_linear", "gtm_linear.workflow"]
depends_on = ["gtm_linear._generated", "gtm_linear.client"]

[[modules]]
path = "gtm_linear.pagination"
layer = "pagination"
visibility = ["gtm_linear.cli", "gtm_linear.queries"]
depends_on = ["gtm_linear.exceptions"]

[[modules]]
path = "gtm_linear.queries"
layer = "operations"
visibility = ["gtm_linear", "gtm_linear.workflow"]
depends_on = [
  "gtm_linear._generated",
  "gtm_linear.client",
  "gtm_linear.exceptions",
  "gtm_linear.pagination",
]

[[modules]]
path = "gtm_linear.settings"
layer = "configuration"
visibility = ["gtm_linear.cli", "gtm_linear.client"]
depends_on = []

[[modules]]
path = "gtm_linear.workflow"
layer = "workflow"
visibility = ["gtm_linear", "gtm_linear.cli"]
depends_on = [
  "gtm_linear._generated",
  "gtm_linear.client",
  "gtm_linear.mutations",
  "gtm_linear.queries",
]

[[interfaces]]
from = ['^gtm_linear$']
expose = [
  "__version__",
  "Attachment",
  "AttachmentCreateInput",
  "Comment",
  "CommentCreateInput",
  "Issue",
  "IssueAttachmentConnection",
  "IssueCommentConnection",
  "IssueConnection",
  "IssueContextAttachment",
  "IssueContextComment",
  "IssueContextRelation",
  "IssueCreateInput",
  "IssueInverseRelationConnection",
  "IssueRelation",
  "IssueRelationConnection",
  "IssueRelationCreateInput",
  "IssueRelationType",
  "IssueSearchConnection",
  "IssueSearchResult",
  "IssueUpdateInput",
  "LinearAPIError",
  "LinearClient",
  "LinearModel",
  "LinearMutations",
  "LinearPaginationError",
  "LinearQueries",
  "LinearWorkflow",
  "LinearWorkflowStateLookupError",
  "PageInfo",
  "PaginationOrderBy",
  "Team",
  "User",
  "WorkflowState",
  "WorkflowStateConnection",
]

