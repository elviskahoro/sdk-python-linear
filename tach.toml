[[interfaces]]
from = ['^gtm_linear[.]client$']
expose = ["DEFAULT_TIMEOUT", "LinearClient"]

[[interfaces]]
from = ['^gtm_linear[.]exceptions$']
expose = [
  "GraphQLError",
  "LinearAPIError",
  "LinearGraphQLError",
  "LinearHTTPError",
  "LinearPaginationError",
  "LinearResponseError",
  "LinearWorkflowStateLookupError",
]

[[interfaces]]
from = ['^gtm_linear[.]models$']
expose = ["LinearModel"]

[[interfaces]]
from = ['^gtm_linear[.]mutations$']
