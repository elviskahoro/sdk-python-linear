# Enforce the SDK package's internal dependency direction.
source_roots = ["."]
exclude = [
  "tests/**",
  "docs/**",
  "tmp/**",
  "worktrees/**",
  ".venv/**",
  ".agents/**",
  ".beads/**",
  ".context/**",
  ".entire/**",
  ".github/**",
]

forbid_circular_dependencies = true
exact = true
root_module = "forbid"
ignore_type_checking_imports = false
include_string_imports = true
layers_explicit_depends_on = true
layers = [
  "tooling",
  "entrypoints",
  "api",
  "workflow",
  "operations",
  "transport",
  "pagination",
  "configuration",
  "errors",
  "generated",
  "models",
]

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"
unused_external_dependencies = "error"

[cache]
file_dependencies = ["tests/**", "pyproject.toml", "uv.lock", "tach.toml"]

[external]
# Tach resolves imported modules against runtime dependencies. These are
# optional/build-only imports (plus stdlib tomllib on the supported Python 3.11+).
exclude = [
  "graphql",
  "ruff",
  "strawberry",
  "tomllib",
]

[[modules]]
path = "scripts"
layer = "tooling"
visibility = []
depends_on = ["gtm_linear"]

[[modules]]
path = "gtm_linear"
layer = "api"
visibility = ["gtm_linear.cli", "scripts"]
depends_on = [
  "gtm_linear._generated",
  "gtm_linear.client",
  "gtm_linear.exceptions",
  "gtm_linear.models",
  "gtm_linear.mutations",
  "gtm_linear.queries",
  "gtm_linear.workflow",
]

[[modules]]
path = "gtm_linear._generated"
layer = "generated"
visibility = [
  "gtm_linear",
  "gtm_linear.cli",
  "gtm_linear.mutations",
  "gtm_linear.queries",
  "gtm_linear.workflow",
]
depends_on = ["gtm_linear.models"]

[[modules]]
path = "gtm_linear._schema"
layer = "generated"
visibility = []
depends_on = []

[[modules]]
path = "gtm_linear.cli"
layer = "entrypoints"
visibility = []
depends_on = [
  "gtm_linear",
  "gtm_linear._generated",
  "gtm_linear.exceptions",
  "gtm_linear.pagination",
  "gtm_linear.settings",
  "gtm_linear.workflow",
]

[[modules]]
path = "gtm_linear.client"
layer = "transport"
visibility = [
  "gtm_linear",
  "gtm_linear.mutations",
  "gtm_linear.queries",
  "gtm_linear.workflow",
]
depends_on = ["gtm_linear.exceptions", "gtm_linear.settings"]

[[modules]]
path = "gtm_linear.exceptions"
layer = "errors"
visibility = [
  "gtm_linear",
  "gtm_linear.cli",
  "gtm_linear.client",
  "gtm_linear.pagination",
  "gtm_linear.queries",
]
depends_on = []

[[modules]]
path = "gtm_linear.models"
layer = "models"
visibility = ["gtm_linear", "gtm_linear._generated"]
depends_on = []

[[modules]]
path = "gtm_linear.mutations"
layer = "operations"
visibility = ["gtm_linear", "gtm_linear.workflow"]
depends_on = ["gtm_linear._generated", "gtm_linear.client"]

[[modules]]
path = "gtm_linear.pagination"
layer = "pagination"
visibility = ["gtm_linear.cli", "gtm_linear.queries"]
depends_on = ["gtm_linear.exceptions"]

[[modules]]
path = "gtm_linear.queries"
layer = "operations"
visibility = ["gtm_linear", "gtm_linear.workflow"]
depends_on = [
  "gtm_linear._generated",
  "gtm_linear.client",
  "gtm_linear.exceptions",
  "gtm_linear.pagination",
]

[[modules]]
path = "gtm_linear.settings"
layer = "configuration"
visibility = ["gtm_linear.cli", "gtm_linear.client"]
depends_on = []

[[modules]]
path = "gtm_linear.workflow"
layer = "workflow"
visibility = ["gtm_linear", "gtm_linear.cli"]
depends_on = [
  "gtm_linear._generated",
  "gtm_linear.client",
  "gtm_linear.mutations",
  "gtm_linear.queries",
]

