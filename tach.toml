  "IssueRelationFields",
  "IssueRelationFieldsIssue",
  "IssueRelationFieldsRelatedIssue",
  "IssueRelationType",
  "IssueSearchResultFields",
  "IssueSearchResultFieldsAssignee",
  "IssueSearchResultFieldsState",
  "IssueUpdateInput",
