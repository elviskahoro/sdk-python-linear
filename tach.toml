  "IssueRelation",
  "IssueRelationConnection",
  "IssueRelationCreateInput",
  "IssueRelationType",
  "IssueSearchConnection",
  "IssueSearchResult",
  "IssueUpdateInput",
  "LinearAPIError",
  "LinearClient",
  "LinearModel",
  "LinearMutations",
  "LinearPaginationError",
  "LinearQueries",
  "LinearWorkflow",
  "LinearWorkflowStateLookupError",
  "PageInfo",
  "PaginationOrderBy",
  "Team",
  "User",
  "WorkflowState",
