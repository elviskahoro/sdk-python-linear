[project]
name = "gtm-linear"
version = "0.5.0"
description = "GTM workflow adapter for Linear."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elvis Kahoro", email = "elvis@dlthub.com" }]
keywords = ["linear", "gtm", "sdk", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Runtime is deliberately small: nothing on the import path needs Strawberry or
# graphql-core. Both are build-time tools (see scripts/codegen.py). Typer is the
# one runtime addition for the shipped CLI (gtm_linear/cli.py + [project.scripts]):
# it is small and pure-Python (rich, shellingham, annotated-doc — it vendors its
# own CLI engine under typer._click rather than depending on click), was already
# in the dev dependency tree via strawberry-graphql[cli], and only the CLI module
# imports it — `import gtm_linear` never touches it.
dependencies = [
  "httpx2>=2.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.14.2",
  "typer>=0.27",
]

[project.optional-dependencies]
# Ships gtm_linear._schema, the generated Strawberry mirror of Linear's types, for
# callers re-exposing Linear data through their own GraphQL server. Floor is 0.336.2:
# regeneration is byte-identical there, and CI's lock pins exactly the floor (the
# exclude-newer cooldown re-lock moved it back from 0.337.2). It also imports
# under 0.316 + graphql-core 3.2, but 0.316's metadata wrongly permits graphql-core
# 3.3 (which breaks it at import), so the floor keeps the extra on a pair that
# cannot resolve into that trap. strawberry.codegen is explicitly experimental and
# version-sensitive — a reason not to put it in `dependencies`, where every consumer
# would inherit the pin.
strawberry = ["strawberry-graphql>=0.336.2"]

[project.scripts]
# Console script for gtm_linear/cli.py. The name matches the package, so
# `uvx gtm-linear ...` runs it without any extra syntax. A shorter `linear`
# alias was considered and rejected: that name collides with other Linear
# CLIs on PyPI, and installing a library dependency should not silently
# claim a generic executable.
gtm-linear = "gtm_linear.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-reportlog>=0.4",
  "respx @ git+https://github.com/elviskahoro/respx@c14645dfce6d10349cd5e3dba19c1a2003fd4032",
  # Codegen toolchain. Build-time only: scripts/codegen.py turns Linear's SDL
  # into the Pydantic models under gtm_linear/_generated/.
  # graphql-core 3.3 freezes its AST dataclasses; codegen.py builds replacement
  # documents instead of mutating parsed nodes, and 3.3's print_ast renders the
  # GraphQL embedded in those models (codegen.py --check byte-diffs the output,
  # so printer drift cannot land silently). The range mirrors strawberry's own:
  # 0.328 is the first release line that requires graphql-core >=3.3, and majors
  # have broken strawberry before (3.3 removed graphql.execution.ExecutionContext,
  # which <=0.316 imported), so re-pin this pair together when either side moves.
  "graphql-core>=3.3,<3.4",
  "strawberry-graphql[cli]>=0.336.2",
  # codegen.py runs `ruff format` over its output so regeneration is byte-stable
  # and `trunk check` has nothing left to reformat. Pinned to the version
  # .trunk/trunk.yaml enables, so both formatters agree on the result.
  "ruff==0.15.14",
  # `tach check-external` runs in .rwx/lint.yml tach-external task; the audit
  # cannot be a Trunk lint command because Trunk runs batch lint commands
  # from a sandbox holding only the diff's files, where the audit would flag
  # every dependency whose import sites sit outside the diff as "not used"
  # (see .trunk/trunk.yaml's tach definition). Pinned to the version
  # .trunk/trunk.yaml enables, so the gate and the audit agree on tach.toml
  # semantics.
  "tach==0.35.1",
  # Depend on our own extra so it is exercised by the default test run instead of
  # silently rotting. A separate CI job installs without it.
  "gtm-linear[strawberry]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: hits the public internet; deselected by default",
  # The mutating subset of `network`, so CI can gate it separately from the
  # read-only live checks: `pytest -m 'network and not network_writes'`.
  # Deselecting it does NOT make the run read-only -- the session-scoped
  # `team` fixture still creates and deletes its own team either way.
  "network_writes: live test that creates, updates or deletes Linear data",
]
addopts = "-m 'not network'"

[project.urls]
Homepage = "https://github.com/elviskahoro/sdk-python-linear"
Repository = "https://github.com/elviskahoro/sdk-python-linear"
Issues = "https://github.com/elviskahoro/sdk-python-linear/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_linear"]

[tool.hatch.build.targets.sdist]
# schema/ and operations/ are the codegen inputs; shipping them makes the sdist
# self-contained enough to regenerate.
include = [
  "gtm_linear",
  "scripts",
  "operations",
  "schema",
  "tests",
  "README.md",
  "LICENSE",
]

[tool.uv]
# Dependency cooldown: ignore packages published in the last 7 days.
exclude-newer = "7 days"
# The respx fork prefers `httpx` when installed and falls back to `httpx2`.
# Drop its transitive `httpx` requirement so it mocks `httpx2`.
# Remove once respx ships httpx2 support upstream.
override-dependencies = ["httpx ; sys_platform == 'never'"]
