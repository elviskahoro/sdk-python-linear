[project]
name = "gtm-linear"
version = "0.0.2"
description = "GTM workflow adapter for Linear."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elvis Kahoro", email = "elvis@dlthub.com" }]
keywords = ["linear", "gtm", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["strawberry-graphql>=0.240.0", "httpx>=0.27.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/elviskahoro/sdk-python-linear"
Repository = "https://github.com/elviskahoro/sdk-python-linear"
Issues = "https://github.com/elviskahoro/sdk-python-linear/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_linear"]

[tool.hatch.build.targets.sdist]
include = ["gtm_linear", "README.md", "LICENSE"]
