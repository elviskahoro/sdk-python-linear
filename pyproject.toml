[project]
name = "gtm-linear"
version = "0.2.2"
description = "GTM workflow adapter for Linear."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elvis Kahoro", email = "elvis@dlthub.com" }]
keywords = ["linear", "gtm", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Runtime is deliberately small: nothing on the import path needs Strawberry or
# graphql-core. Both are build-time tools (see scripts/codegen.py).
dependencies = ["httpx>=0.27.0", "pydantic>=2.0.0", "pydantic-settings>=2.14.2"]

[project.optional-dependencies]
# Ships gtm_linear._schema, the generated Strawberry mirror of Linear's types, for
# callers re-exposing Linear data through their own GraphQL server. Floor is 0.316
# because the codegen behaviour this package depends on is version-sensitive, and
# strawberry.codegen is explicitly experimental — a reason not to put it in
# `dependencies`, where every consumer would inherit the pin.
strawberry = ["strawberry-graphql>=0.316.0"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  # Codegen toolchain. Build-time only: scripts/codegen.py turns Linear's SDL
  # into the Pydantic models under gtm_linear/_generated/.
  # graphql-core is capped below 3.3 because strawberry 0.316 — the codegen
  # backend — cannot import graphql-core 3.3 at all: its schema module expects
  # graphql.execution.ExecutionContext, which 3.3 removed. codegen.py itself is
  # frozen-AST-safe (it builds replacement documents instead of mutating
  # parsed nodes; the old in-place splice is what broke 13 CI tests when a
  # fresh resolution pulled 3.3.0). Lift the cap only together with a
  # strawberry release that supports 3.3 and a regeneration of the output.
  "graphql-core>=3.2,<3.3",
  "strawberry-graphql[cli]>=0.316.0",
  # codegen.py runs `ruff format` over its output so regeneration is byte-stable
  # and `trunk check` has nothing left to reformat. Pinned to the version
  # .trunk/trunk.yaml enables, so both formatters agree on the result.
  "ruff==0.15.14",
  # Depend on our own extra so it is exercised by the default test run instead of
  # silently rotting. A separate CI job installs without it.
  "gtm-linear[strawberry]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: hits the public internet; deselected by default"]
addopts = "-m 'not network'"

[project.urls]
Homepage = "https://github.com/elviskahoro/sdk-python-linear"
Repository = "https://github.com/elviskahoro/sdk-python-linear"
Issues = "https://github.com/elviskahoro/sdk-python-linear/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_linear"]

[tool.hatch.build.targets.sdist]
# schema/ and operations/ are the codegen inputs; shipping them makes the sdist
# self-contained enough to regenerate.
include = [
  "gtm_linear",
  "scripts",
  "operations",
  "schema",
  "tests",
  "README.md",
  "LICENSE",
]
