"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Prompts are pointers to the canonical text in elviskahoro/oss-hq
# (prompts/conductor/*.md), not copies, so there is nothing to re-sync.

[prompts]
create_pr = '''
Follow the canonical instructions for creating pull requests at
https://raw.githubusercontent.com/elviskahoro/oss-hq/main/prompts/conductor/create-pr.md
Fetch them first (`curl -fsSL <url>`) and follow them exactly; where this
repo's AGENTS.md/CLAUDE.md differ, the repo wins. If the fetch fails, say so
and stop instead of improvising.
'''
rename_branch = "make sure that the branch prefix is always \"conductor/\""
