"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[prompts]
rename_branch = "make sure that the branch prefix is always \"conductor/\""
create_pr = '''
Follow the canonical oss-hq prompt for creating or updating a pull request: https://github.com/elviskahoro/oss-hq/blob/main/prompts/conductor/create-pr.md
Fetch it fresh each time; set `CONDUCTOR_PROMPTS_REF` to a SHA or tag to pin, default `main` (`curl -fsSL https://raw.githubusercontent.com/elviskahoro/oss-hq/${CONDUCTOR_PROMPTS_REF:-main}/prompts/conductor/create-pr.md` or `gh api "repos/elviskahoro/oss-hq/contents/prompts/conductor/create-pr.md?ref=${CONDUCTOR_PROMPTS_REF:-main}" --jq .content | base64 -d`) and follow it exactly. Where this repo's CLAUDE.md differs, the repo wins.
Repo override for roborev: `roborev` is not installed in cloud sandboxes, so run the review with `RWX_ACCESS_TOKEN="$RWX_ACCESS_TOKEN_ELVISKAHORO" rwx run .rwx/roborev.yml --wait` and read findings with `rwx results` / `rwx logs`. Skip only if `rwx` is unavailable, and disclose that.
'''
