name: dagger-ref-drift

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # yamllint disable-line rule:empty-values

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compare pinned dagger module ref to upstream HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=elviskahoro/sdk-python-publish-to-pypi
          pinned=$(grep -oP "${repo}@\K[0-9a-f]{40}" .github/workflows/pypi.yml)
          head=$(git ls-remote "https://github.com/${repo}" HEAD | cut -f1)
          echo "pinned=${pinned} upstream=${head}"
          if [ "${pinned}" = "${head}" ]; then exit 0; fi
          title="Dagger publish module ref is stale"
          open=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq length)
          if [ "${open}" = "0" ]; then
            gh issue create --title "${title}" \
              --body "pypi.yml pins ${repo}@${pinned}, but upstream HEAD is ${head}. Review and re-pin. See #45."
          fi
