name: publish

on:
  push:
    tags:
      - v*
  workflow_dispatch: {} # yamllint disable-line rule:empty-values

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v8.4.1
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
      # Offline guard confirms the active SHA matches Renovate's metadata record;
      # it does not verify that the SHA belongs to the recorded release tag.
      # Weekly RWX verifies that mapping and reports drift, but does not block publishing.
      # Required format: publisher-module-sha: <tag> <40-character lowercase SHA>.
      # Keep this record within 8 lines of the dagger -m command for Renovate.
      # publisher-module-sha: v0.2.2 1cdcc45e2e4fe78768d73def9cbe23a54209f618
      - name: Verify publisher module SHA pin
        run: bash scripts/dagger_ref_drift.sh --verify-pin
      - run: >-
          dagger -m github.com/elviskahoro/sdk-python-publish-to-pypi@1cdcc45e2e4fe78768d73def9cbe23a54209f618 call build --source . export --path dist
      # v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      # v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
