name: publish

on:
  push:
    tags:
      - v*
  workflow_dispatch: {} # yamllint disable-line rule:empty-values

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v8.4.1
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
      # Pinned commit of the owner's module (no tags); checked weekly by
      # dagger-ref-drift.yml.
      - run: >-
          dagger -m github.com/elviskahoro/sdk-python-publish-to-pypi@1cdcc45e2e4fe78768d73def9cbe23a54209f618 call build --source . export --path dist
      # v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      # v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
