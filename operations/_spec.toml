# Declarative operation spec. `uv run python scripts/gen_operations.py` turns this
# into operations/*.graphql by reading schema/linear.graphql.
#
# What is derived from the schema (never written here):
#   - every field's existence, type, and nullability
#   - the nesting path from a root field down to the entity (payload wrappers,
#     connection `nodes`, etc.)
#   - `pageInfo` selections on anything that paginates
#   - variable types for the root field's arguments
#
# What you choose here: which entities to project, and how much of each.
#
# `fields = "all"` takes every non-deprecated leaf field the schema defines. That is
# the most drift-proof option — new Linear fields appear automatically — but it makes
# responses larger. An explicit list is still schema-checked: a typo or a field Linear
# removes fails generation rather than surfacing at runtime.

[fragments.UserFields]
on = "User"
fields = ["id", "name", "email", "active"]

[fragments.TeamFields]
on = "Team"
fields = ["id", "name", "key"]

[fragments.WorkflowStateFields]
on = "WorkflowState"
fields = ["id", "name", "type", "color", "position"]

[fragments.PageInfoFields]
on = "PageInfo"
fields = "all"

[fragments.CommentFields]
on = "Comment"
fields = ["id", "body", "url", "createdAt"]

[fragments.IssueContextCommentFields]
on = "Comment"
fields = ["id", "body", "url", "createdAt"]
[fragments.IssueContextCommentFields.expand]
user = ["id", "name", "email", "active"]
externalUser = ["id", "displayName", "name", "email"]

[fragments.IssueContextAttachmentFields]
on = "Attachment"
fields = ["id", "title", "url", "source", "sourceType", "metadata", "createdAt"]

[fragments.IssueContextRelationFields]
on = "IssueRelation"
fields = ["id", "type", "createdAt"]
[fragments.IssueContextRelationFields.expand]
issue = ["id", "identifier", "title", "url"]
relatedIssue = ["id", "identifier", "title", "url"]

[fragments.AttachmentFields]
on = "Attachment"
fields = ["id", "createdAt", "updatedAt", "subtitle", "title", "url"]

[fragments.IssueRelationFields]
on = "IssueRelation"
fields = ["id", "type", "createdAt", "updatedAt"]
[fragments.IssueRelationFields.expand]
issue = ["id", "identifier"]
relatedIssue = ["id", "identifier"]

[fragments.IssueFields]
on = "Issue"
fields = ["id", "identifier", "title", "description", "url", "priority"]
# Nested objects are inlined rather than spread: strawberry codegen raises on a
# fragment that contains a fragment spread.
[fragments.IssueFields.expand]
state = ["id", "name", "type"]
assignee = ["id", "name", "email", "active"]

[fragments.IssueSearchResultFields]
on = "IssueSearchResult"
fields = ["id", "identifier", "title", "description", "url", "priority"]
[fragments.IssueSearchResultFields.expand]
state = ["id", "name", "type"]
assignee = ["id", "name", "email", "active"]


[operations.GetIssue]
kind = "query"
root = "issue"
fragment = "IssueFields"
variables = { id = "String!" }
arguments = { id = "$id" }

[operations.GetTeam]
kind = "query"
root = "team"
fragment = "TeamFields"
variables = { id = "String!" }
arguments = { id = "$id" }

[operations.GetTeamByKey]
kind = "query"
root = "teams"
fragment = "TeamFields"
variables = { key = "String!" }
arguments = { filter = "{ key: { eq: $key } }", first = "1" }
paginated = false

[operations.GetUser]
kind = "query"
root = "user"
fragment = "UserFields"
variables = { id = "String!" }
arguments = { id = "$id" }

[operations.GetViewer]
kind = "query"
root = "viewer"
fragment = "UserFields"

[operations.ListIssues]
kind = "query"
root = "issues"
fragment = "IssueFields"
variables = { filter = "IssueFilter", first = "Int!", after = "String", orderBy = "PaginationOrderBy", includeArchived = "Boolean!" }
arguments = { filter = "$filter", first = "$first", after = "$after", orderBy = "$orderBy", includeArchived = "$includeArchived" }

[operations.ListWorkflowStates]
kind = "query"
root = "workflowStates"
fragment = "WorkflowStateFields"
variables = { filter = "WorkflowStateFilter", first = "Int!", after = "String", orderBy = "PaginationOrderBy", includeArchived = "Boolean!" }
arguments = { filter = "$filter", first = "$first", after = "$after", orderBy = "$orderBy", includeArchived = "$includeArchived" }

[operations.SearchIssues]
kind = "query"
root = "searchIssues"
fragment = "IssueSearchResultFields"
variables = { term = "String!", first = "Int!", after = "String" }
arguments = { term = "$term", first = "$first", after = "$after" }

[operations.CreateIssue]
kind = "mutation"
root = "issueCreate"
fragment = "IssueFields"
variables = { input = "IssueCreateInput!" }
arguments = { input = "$input" }

[operations.UpdateIssue]
kind = "mutation"
root = "issueUpdate"
fragment = "IssueFields"
variables = { id = "String!", input = "IssueUpdateInput!" }
arguments = { id = "$id", input = "$input" }

[operations.DeleteIssue]
kind = "mutation"
root = "issueDelete"
variables = { id = "String!" }
arguments = { id = "$id" }

[operations.CreateComment]
kind = "mutation"
root = "commentCreate"
fragment = "CommentFields"
variables = { input = "CommentCreateInput!" }
arguments = { input = "$input" }

[operations.CreateAttachment]
kind = "mutation"
root = "attachmentCreate"
fragment = "AttachmentFields"
variables = { input = "AttachmentCreateInput!" }
arguments = { input = "$input" }

[operations.CreateIssueRelation]
kind = "mutation"
root = "issueRelationCreate"
fragment = "IssueRelationFields"
variables = { input = "IssueRelationCreateInput!" }
arguments = { input = "$input" }

[operations.ListIssueComments]
kind = "query"
root = "issue"
variables = { id = "String!", first = "Int!", after = "String", includeArchived = "Boolean!" }
arguments = { id = "$id" }
[operations.ListIssueComments.connection]
field = "comments"
fragment = "IssueContextCommentFields"
arguments = { first = "$first", after = "$after", includeArchived = "$includeArchived" }

[operations.ListIssueAttachments]
kind = "query"
root = "issue"
variables = { id = "String!", first = "Int!", after = "String", includeArchived = "Boolean!" }
arguments = { id = "$id" }
[operations.ListIssueAttachments.connection]
field = "attachments"
fragment = "IssueContextAttachmentFields"
arguments = { first = "$first", after = "$after", includeArchived = "$includeArchived" }

[operations.ListIssueRelations]
kind = "query"
root = "issue"
variables = { id = "String!", first = "Int!", after = "String", includeArchived = "Boolean!" }
arguments = { id = "$id" }
[operations.ListIssueRelations.connection]
field = "relations"
fragment = "IssueContextRelationFields"
arguments = { first = "$first", after = "$after", includeArchived = "$includeArchived" }

[operations.ListIssueInverseRelations]
kind = "query"
root = "issue"
variables = { id = "String!", first = "Int!", after = "String", includeArchived = "Boolean!" }
arguments = { id = "$id" }
[operations.ListIssueInverseRelations.connection]
field = "inverseRelations"
fragment = "IssueContextRelationFields"
arguments = { first = "$first", after = "$after", includeArchived = "$includeArchived" }
