query FindIssuesByAttachmentUrl($filter: IssueFilter, $first: Int!, $after: String, $includeArchived: Boolean!) {
  issues(filter: $filter, first: $first, after: $after, includeArchived: $includeArchived) {
    nodes {
      ...AttachmentLookupIssueFields
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}
